plugins { id 'com.android.application' }

android {
    namespace 'com.localcanvas.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.localcanvas.app'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0-native'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments "-DSDCPP_DIR=${project.findProperty('sdCppDir') ?: ''}" } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
  
