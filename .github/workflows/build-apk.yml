name: Build LocalCanvas APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan-dev unzip
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/gradle-8.9/bin/gradle"
      - name: Unpack latest project
        run: unzip -q LocalCanvas-AndroidIDE-v3.zip -d project
      - name: Fetch Vulkan headers
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git spirv-headers
          cmake -S spirv-headers -B spirv-build -DSPIRV_HEADERS_ENABLE_TESTS=OFF -DSPIRV_HEADERS_ENABLE_INSTALL=ON -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/spirv-install"
          cmake --build spirv-build --target install
          mkdir -p "$GITHUB_WORKSPACE/spirv-install/include"
          cp -R spirv-headers/include/spirv "$GITHUB_WORKSPACE/spirv-install/include/"
          mkdir -p "$GITHUB_WORKSPACE/spirv-install/lib/cmake/SPIRV-Headers"
          printf '%s\n' 'add_library(SPIRV-Headers INTERFACE)' 'add_library(SPIRV-Headers::SPIRV-Headers ALIAS SPIRV-Headers)' 'set_target_properties(SPIRV-Headers PROPERTIES' '  INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include")' > "$GITHUB_WORKSPACE/spirv-install/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
          printf '%s\n' 'set(PACKAGE_VERSION "1.0")' 'set(PACKAGE_VERSION_COMPATIBLE TRUE)' 'set(PACKAGE_VERSION_EXACT TRUE)' > "$GITHUB_WORKSPACE/spirv-install/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfigVersion.cmake"
          test -f "$GITHUB_WORKSPACE/spirv-install/lib/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
      - name: Fetch pinned stable-diffusion.cpp
        working-directory: project
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git native/stable-diffusion.cpp
          git -C native/stable-diffusion.cpp checkout 52491bd9f1fc15281791723bdff13baab7fd6819
          git -C native/stable-diffusion.cpp submodule update --init --recursive
      - name: Build native ARM64 APK
        working-directory: project
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export CMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/spirv-install"
          perl -0pi -e 's/final Runnable progressPoll=/final Runnable[] progressPoll=new Runnable[1]; {progressPoll[0]=/; s/postDelayed\(progressPoll,/postDelayed(progressPoll[0],/; s/post\(progressPoll\)/post(progressPoll[0])/; s/removeCallbacks\(progressPoll\)/removeCallbacks(progressPoll[0])/' app/src/main/java/com/localcanvas/app/MainActivity.java
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --stacktrace assembleDebug
      - name: Verify native library
        working-directory: project
        run: |
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/liblocalcanvas_native\.so'
          unzip -p "$APK" lib/arm64-v8a/liblocalcanvas_native.so > /tmp/liblocalcanvas_native.so
          file /tmp/liblocalcanvas_native.so
          readelf -h /tmp/liblocalcanvas_native.so | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          test "$(stat -c%s /tmp/liblocalcanvas_native.so)" -gt 100000
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localcanvas-native-arm64-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
